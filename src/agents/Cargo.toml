[workspace]
resolver = "2"
members = [
    "analyzer",
    "enforcer",
    "decoy",
    "netcap", "sentinel",
    "watchfile",
    "trustroot", "tunnel",
    "sentinel-darwin", "telemetry-win", "enforcer-win",
    "cts_sec", "cts_ipc",
]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
sysinfo = "0.29"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
rayon = "1.8"
once_cell = "1.18"
parking_lot = "0.12"
anyhow = "1.0"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
