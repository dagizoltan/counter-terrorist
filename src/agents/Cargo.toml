[workspace]
resolver = "2"
members = [
    "scanner",
    "blocker",
    "honeypot",
    "pcap", "ebpf", "ebpf/ebpf",
    "fim",
]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
sysinfo = "0.29"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
rayon = "1.8"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
