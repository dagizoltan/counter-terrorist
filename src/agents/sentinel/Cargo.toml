[package]
name = "sentinel"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
zerocopy = { version = "0.7", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.1"
chrono = "0.4"
anyhow = "1.0"
env_logger = "0.10"
log = "0.4"
bytes = "1.11"
once_cell = "1.18"
parking_lot = "0.12"
sysinfo = "0.29"
cts_ipc = { path = "../cts_ipc" }

[target.'cfg(target_os = "linux")'.dependencies]
aya = "0.12"
libc = "0.2"
rlimit = "0.10"
sentinel-common = { path = "./common", features = ["user"] }

[[bin]]
name = "sentinel"
path = "src/main.rs"
